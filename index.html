<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp - Quiz Anti-Golpe</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone-container">
    <div id="tela-inicial" class="screen-overlay">
        <div class="welcome-card">
            <div class="icon-shield">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1>Quiz Anti-Golpe</h1>
            <p>Enfrente 3 níveis progressivos (Básico, Intermediário e Avançado) para testar sua blindagem digital.</p>
            <button onclick="iniciarJogo()" class="btn-start">Começar Nível 1</button>
        </div>
    </div>

    <div id="tela-final" class="screen-overlay hidden">
        <div class="welcome-card" style="max-height: 92%; overflow-y: auto;">
            <div id="resultado-icone" class="icon-shield" style="min-height: 70px; width: 70px; height: 70px; font-size: 30px; margin-bottom: 12px;">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <span id="subtitulo-nivel-final" style="font-size: 12px; font-weight: 700; text-transform: uppercase; color: #008069; letter-spacing: 0.5px; margin-bottom: 4px;"></span>
            <h1 id="resultado-titulo" style="font-size: 22px;"></h1>
            <p id="resultado-texto" style="margin-bottom: 12px; font-size: 14px;"></p>
            <div class="score-display" style="font-size: 36px; margin-bottom: 16px;">
                <span id="pontuacao-final">0</span> / <span id="total-final">0</span>
            </div>

            <div id="resumo-geral-niveis" class="hidden" style="width: 100%; margin-bottom: 16px; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; text-align: left; font-size: 13px;">
                <p style="font-weight: 700; color: #111b21; margin-bottom: 8px; text-align: center;">Desempenho por Nível</p>
                <div id="lista-desempenho-niveis" style="display: flex; flex-direction: column; gap: 6px;"></div>
            </div>
            
            <div id="referencias-container" style="text-align: left; width: 100%; margin-bottom: 16px; font-size: 12.5px; background-color: #f0f2f5; padding: 12px; border-radius: 12px;">
                <p style="font-weight: 700; margin-bottom: 8px; color: #111b21;">Material de Apoio deste Nível:</p>
                <ul id="lista-referencias" style="list-style-type: none; display: flex; flex-direction: column; gap: 8px;">
                </ul>
            </div>

            <button id="btn-acao-final" onclick="avancarOuReiniciar()" class="btn-start">Próximo Nível</button>
        </div>
    </div>

    <div class="chat-header">
        <div class="header-left">
            <i class="fa-solid fa-arrow-left back-arrow"></i>
            <div class="profile-pic">
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="chat-details">
                <span id="var-nome" class="chat-title"></span>
                <span id="var-numero" class="chat-subtitle"></span>
            </div>
        </div>
        <div class="header-actions">
            <span id="badge-nivel" class="progress-badge">Nível 1</span>
            <span id="contador-rodada" class="progress-badge">1/10</span>
        </div>
    </div>

    <div class="chat-messages">
        <div id="var-dia" class="date-divider"></div>

        <div class="message-row">
            <div class="message-bubble">
                <span id="var-conteudo"></span>
                <div class="message-meta">
                    <span id="var-horario"></span>
                </div>
            </div>
        </div>
    </div>

    <div class="decision-container">
        <button onclick="verificarResposta(true)" class="btn-golpe">
            <i class="fa-solid fa-triangle-exclamation"></i> GOLPE!
        </button>
        <button onclick="verificarResposta(false)" class="btn-seguro">
            <i class="fa-solid fa-check"></i> SEGURO
        </button>
    </div>

    <div id="modal-feedback" class="modal hidden">
        <div class="modal-content">
            <div id="modal-icone"></div>
            <h2 id="modal-titulo"></h2>
            <p id="modal-explicacao"></p>
            <button onclick="proximaRodada()" class="btn-continuar">Continuar</button>
        </div>
    </div>

</div>

<script src="banco.js"></script>
<script src="script.js"></script>
</body>
</html>
